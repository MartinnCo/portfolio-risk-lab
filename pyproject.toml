[project]
name = "portfolio-risk-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MartinnCo", email = "164150011+MartinnCo@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "pyiceberg[pyarrow,sql-sqlite]>=0.12.0",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
    "yfinance>=1.8.0",
]

[project.scripts]
portfolio-risk-lab = "portfolio_risk_lab:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.6",
    "pytest>=9.2.0",
]
